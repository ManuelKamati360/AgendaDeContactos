<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Agenda de Contatos</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    #mensagem { margin-top: 15px; font-weight: bold; }
    .erro { color: red; }
    .sucesso { color: green; }
    button { margin: 2px; }
    #barraPesquisa, #formNovoContato { margin-top: 20px; }
    input { margin: 2px; }
  </style>
</head>
<body>
  <h1>Lista de Contatos</h1>
  <div id="mensagem"></div>

  <!-- Barra de pesquisa -->
  <div id="barraPesquisa">
    <input type="text" id="searchInput" placeholder="Digite para buscar...">
    <button onclick="buscarContatos()">Pesquisar</button>
    <button onclick="carregarContatos()">Mostrar todos</button>
  </div>

  <!-- Formulário para adicionar novo contato -->
  <div id="formNovoContato">
    <h2>Adicionar Novo Contato</h2>
    <input type="text" id="novoNome" placeholder="Nome">
    <input type="date" id="novoDataNascimento">
    <input type="text" id="novoTelefone" placeholder="Telefone">
    <input type="email" id="novoEmail" placeholder="Email">
    <input type="text" id="novoEndereco" placeholder="Endereço">
    <input type="text" id="novoEstado" placeholder="Estado">
    <input type="text" id="novoCidade" placeholder="Cidade">
    <button onclick="adicionarContato()">Adicionar</button>
  </div>

  <table id="contatosTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Data de nascimento</th>
        <th>Telefone</th>
        <th>Email</th>
        <th>Endereço</th>
        <th>Estado</th>
        <th>Cidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- Contatos serão inseridos aqui via JS -->
    </tbody>
  </table>

  <script>
    function mostrarMensagem(texto, tipo) {
      const div = document.getElementById("mensagem");
      div.textContent = texto;
      div.className = tipo; // "erro" ou "sucesso"
    }

    // Função para carregar todos os contatos
    function carregarContatos() {
      fetch("/AgendaDeContactos/api/contatos")
        .then(res => res.json())
        .then(data => renderTabela(data))
        .catch(err => mostrarMensagem("Erro: " + err.message, "erro"));
    }

    // Função para buscar contatos por termo
    function buscarContatos() {
      const termo = document.getElementById("searchInput").value;
      if (!termo) {
        mostrarMensagem("Digite algo para pesquisar!", "erro");
        return;
      }
      fetch("/AgendaDeContactos/api/contatos?search=" + encodeURIComponent(termo))
        .then(res => {
          if (res.status === 404) {
            mostrarMensagem("Nenhum contato encontrado!", "erro");
            return [];
          }
          return res.json();
        })
        .then(data => renderTabela(data))
        .catch(err => mostrarMensagem("Erro: " + err.message, "erro"));
    }

    // Renderizar tabela
    function renderTabela(data) {
      const tbody = document.querySelector("#contatosTable tbody");
      tbody.innerHTML = "";
      data.forEach(c => inserirNaTabela(c));
      mostrarMensagem("Contatos carregados com sucesso!", "sucesso");
    }

    // Inserir contato no fim da tabela
    function inserirNaTabela(c) {
      const tbody = document.querySelector("#contatosTable tbody");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${c.id}</td>
        <td>${c.nome}</td>
        <td>${c.dataNascimento || ""}</td>
        <td>${c.telefone}</td>
        <td>${c.email}</td>
        <td>${c.endereco}</td>
        <td>${c.estado}</td>
        <td>${c.cidade}</td>
        <td>
          <button onclick="editarLinha(this, ${c.id})">Editar</button>
          <button onclick="removerContato(${c.id})">Excluir</button>
        </td>
      `;
      tbody.appendChild(row);
    }

    // Função para adicionar novo contato via POST JSON
    function adicionarContato() {
      const dados = {
        nome: document.getElementById("novoNome").value,
        dataNascimento: document.getElementById("novoDataNascimento").value,
        telefone: document.getElementById("novoTelefone").value,
        email: document.getElementById("novoEmail").value,
        endereco: document.getElementById("novoEndereco").value,
        estado: document.getElementById("novoEstado").value,
        cidade: document.getElementById("novoCidade").value
      };

      fetch("/AgendaDeContactos/api/contatos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      })
      .then(res => {
        if (res.status === 201) {
          mostrarMensagem("Contato adicionado com sucesso!", "sucesso");
          return res.json(); // backend deve devolver o objeto criado
        } else {
          throw new Error("Erro ao adicionar contato");
        }
      })
      .then(novoContato => {
        inserirNaTabela(novoContato); // adiciona direto no fim da tabela
        limparFormulario();
      })
      .catch(err => mostrarMensagem("Falha: " + err.message, "erro"));
    }

    // Função para limpar formulário após adicionar
    function limparFormulario() {
      document.querySelectorAll("#formNovoContato input").forEach(input => input.value = "");
    }

    // Função para editar inline
    function editarLinha(botao, id) {
      const row = botao.closest("tr");
      const cells = row.querySelectorAll("td");

      const nome = cells[1].textContent;
      const dataNascimento = cells[2].textContent;
      const telefone = cells[3].textContent;
      const email = cells[4].textContent;
      const endereco = cells[5].textContent;
      const estado = cells[6].textContent;
      const cidade = cells[7].textContent;

      cells[1].innerHTML = `<input value="${nome}">`;
      cells[2].innerHTML = `<input type="date" value="${formatarDataISO(dataNascimento)}">`;
      cells[3].innerHTML = `<input value="${telefone}">`;
      cells[4].innerHTML = `<input value="${email}">`;
      cells[5].innerHTML = `<input value="${endereco}">`;
      cells[6].innerHTML = `<input value="${estado}">`;
      cells[7].innerHTML = `<input value="${cidade}">`;

      cells[8].innerHTML = `
        <button onclick="salvarEdicao(${id}, this)">Salvar</button>
        <button onclick="carregarContatos()">Cancelar</button>
      `;
    }

    // Função para salvar edição via PUT JSON
    function salvarEdicao(id, botao) {
      const row = botao.closest("tr");
      const inputs = row.querySelectorAll("input");

      const dados = {
        nome: inputs[0].value,
        dataNascimento: inputs[1].value,
        telefone: inputs[2].value,
        email: inputs[3].value,
        endereco: inputs[4].value,
        estado: inputs[5].value,
        cidade: inputs[6].value
      };

      fetch("/AgendaDeContactos/api/contatos/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      })
      .then(res => {
        if (res.status === 200) {
          mostrarMensagem("Contato atualizado com sucesso!", "sucesso");
          carregarContatos();
        } else {
          mostrarMensagem("Erro ao atualizar contato", "erro");
        }
      })
      .catch(err => mostrarMensagem("Falha: " + err.message, "erro"));
    }

    // Função para remover contato via DELETE
    function removerContato(id) {
      if (!confirm("Tem certeza que deseja excluir o contato " + id + "?")) return;
      fetch("/AgendaDeContactos/api/contatos/" + id, {
        method: "DELETE"
      })
      .then(res => {
        if (res.status === 204) {
          mostrarMensagem("Contato removido com sucesso!", "sucesso");
          carregarContatos();
        } else {
          mostrarMensagem("Erro ao remover contato", "erro");
        }
      })
      .catch(err => mostrarMensagem("Falha: " + err.message, "erro"));
    }

    // Função para converter datas em formato ISO (corrigida)
    function formatarDataISO(dataStr) {
      const partes = dataStr.split(" ");
      if (partes.length === 3) {
        const meses = {
          "jan.": "01", "fev.": "02", "mar.": "03", "abr.": "04",
          "mai.": "05", "jun.": "06", "jul.": "07", "ago.": "08",
          "set.": "09", "out.": "10", "nov.": "11", "dez.": "12"
        };
        const dia = partes[1].replace(",", "");
        const mes = meses[partes[0]] || "01";
        const ano = partes[2];
        return `${ano}-${mes}-${dia.padStart(2, "0")}`;
      }
      return "";
    }

    // Carregar contatos ao abrir página
    carregarContatos();
  </script>
</body>
</html>
